# Configuration for CIFAR-10-LT experiment

data:
  dataset_name: "cifar10-lt"
  cifar10_config: "r-10"
  image_size: 32
  num_classes: 10
  num_workers: 2

augmentation:
  horizontal_flip: true
  crop_size: 32
  crop_padding: 4

encoder:
  architecture: "resnet50"
  projection_dim: 128
  hidden_dim: 2048
  num_layers: 2
  use_bn: true

contrastive_loss:
  loss_type: "supcon"
  temperature: 0.1
  use_cosine_similarity: true

contrastive_training:
  batch_size: 256
  num_epochs: 100
  learning_rate: 0.01
  weight_decay: 0.0001
  momentum: 0.9
  cosine_annealing: true
  warmup_epochs: 10

classifier_training:
  batch_size: 256
  num_epochs: 30
  learning_rate: 0.01
  weight_decay: 0.0001
  momentum: 0.9
  patience: 20

classifier:
  num_classes: 10
  hidden_dim: null
  num_layers: 2

evaluation:
  eval_batch_size: 128
  num_classes: 10
  compute_confusion_matrix: true

val_ratio: 0.05
seed: 42
output_dir: "outputs/cifar10lt-r10"
device: "cuda"
